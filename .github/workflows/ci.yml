name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.17"
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --locked --all-extras --dev
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest -q
      - run: uv build
      - name: Clean wheel smoke
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/alphamosaic-wheel"
          "$RUNNER_TEMP/alphamosaic-wheel/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/alphamosaic-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/alphamosaic-wheel/bin/alphamosaic" doctor
      - name: Dependency audit
        run: uvx --from pip-audit pip-audit --requirement <(uv export --format requirements-txt --no-hashes)
        shell: bash
      - name: Credential and secret scan
        run: uv run python scripts/secret_scan.py

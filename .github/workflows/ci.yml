name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  schedule:
    - cron: "37 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.17"
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --locked --all-extras --dev
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest -q -W error::RuntimeWarning
      - name: Offline reproducibility and performance smoke
        run: uv run python scripts/benchmark_replay.py --sessions 100
      - name: Local MCP protocol handshake
        run: uv run python scripts/mcp_smoke.py
      - run: uv build
      - name: Clean wheel smoke
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/alphamosaic-wheel"
          "$RUNNER_TEMP/alphamosaic-wheel/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/alphamosaic-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/alphamosaic-wheel/bin/alphamosaic" doctor
          mkdir -p "$RUNNER_TEMP/alphamosaic-wheel-work"
          cd "$RUNNER_TEMP/alphamosaic-wheel-work"
          "$RUNNER_TEMP/alphamosaic-wheel/bin/python" "$GITHUB_WORKSPACE/scripts/verify_wheel.py"
      - name: Dependency audit
        run: uvx --from pip-audit pip-audit --requirement <(uv export --locked --all-extras --format requirements-txt --no-hashes --no-emit-project)
        shell: bash
      - name: Credential and secret scan
        run: uv run python scripts/secret_scan.py
      - name: Upload build and test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alphamosaic-ci-${{ github.run_id }}
          path: |
            dist/
            .pytest_cache/
          if-no-files-found: ignore
